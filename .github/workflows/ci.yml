name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:frontend

      - name: Unit tests
        run: npm run test:frontend

      - name: Build
        run: npm run build:frontend

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install Python dependencies
        working-directory: apps/backend
        run: uv sync --dev

      - name: Lint
        working-directory: apps/backend
        run: uv run ruff check app tests alembic

      - name: Unit and integration tests
        working-directory: apps/backend
        run: REDIS_URL= uv run pytest -q

  contract:
    name: API contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check generated API artifacts
        run: npm run check:generated
