openapi: 3.1.0
info:
  title: User Management API
  version: 1.0.0
  description: Contract-first API for the user management application.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Health
  - name: Authentication
  - name: Users
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check whether the API process is alive
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check whether required dependencies are available
      responses:
        "200":
          description: API and PostgreSQL are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: A required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an authenticated browser session
      description: Sets an HttpOnly session cookie. The returned CSRF token is kept in frontend memory and sent for unsafe requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current browser session
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the authenticated user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Return a CSRF token for the current browser session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token for unsafe requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List active users
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user profile
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: User created
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get one active user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update a user profile
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Soft-delete a user profile
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: User soft-deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: HttpOnly session cookie issued by the login endpoint.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for state-changing requests after login.

  headers:
    RequestId:
      description: Correlation identifier for the request.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    RateLimitLimit:
      description: Maximum requests permitted in the current rate-limit window.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Number of seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Case-insensitive name or email search.
      schema:
        type: string
        maxLength: 120
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, email, birthDate, createdAt, updatedAt]
        default: createdAt
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    Unauthorized:
      description: Authentication is required or the credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist or is not active.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    UserRole:
      type: string
      enum: [admin, user]
    Gender:
      type: string
      enum: [Men, Women]
    User:
      type: object
      required:
        [
          id,
          name,
          email,
          gender,
          birthDate,
          college,
          address,
          hobbies,
          customHobbies,
          role,
          isActive,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        gender:
          $ref: "#/components/schemas/Gender"
        birthDate:
          type: string
          format: date
          description: Birth date must be from 1960-01-01 through 2000-01-01. The backend enforces the date comparison.
          x-date-minimum: "1960-01-01"
          x-date-maximum: "2000-01-01"
        college:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        hobbies:
          $ref: "#/components/schemas/HobbyList"
        customHobbies:
          $ref: "#/components/schemas/HobbyList"
        role:
          $ref: "#/components/schemas/UserRole"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserCreateRequest:
      type: object
      required: [name, email, gender, birthDate, college, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        gender:
          $ref: "#/components/schemas/Gender"
        birthDate:
          type: string
          format: date
          description: Birth date must be from 1960-01-01 through 2000-01-01. The backend enforces the date comparison.
          x-date-minimum: "1960-01-01"
          x-date-maximum: "2000-01-01"
        college:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        hobbies:
          $ref: "#/components/schemas/HobbyList"
          default: []
        customHobbies:
          $ref: "#/components/schemas/HobbyList"
          default: []
        role:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          default: user

    UserUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        gender:
          $ref: "#/components/schemas/Gender"
        birthDate:
          type: string
          format: date
          description: Birth date must be from 1960-01-01 through 2000-01-01. The backend enforces the date comparison.
          x-date-minimum: "1960-01-01"
          x-date-maximum: "2000-01-01"
        college:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        hobbies:
          $ref: "#/components/schemas/HobbyList"
        customHobbies:
          $ref: "#/components/schemas/HobbyList"
        role:
          $ref: "#/components/schemas/UserRole"

    HobbyList:
      type: array
      maxItems: 20
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 80

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128

    LoginResponse:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          minLength: 32
          maxLength: 256

    CsrfResponse:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
          minLength: 32
          maxLength: 256

    UserListResponse:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [ok]

    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          examples: [validation_error]
        message:
          type: string
          maxLength: 500
        details:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          type: string
          minLength: 1
          maxLength: 128
