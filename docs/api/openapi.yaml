          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        gender:
          $ref: "#/components/schemas/Gender"
        birthDate:
          type: string
          format: date
          description: Birth date must be from 1960-01-01 through 2000-01-01. The backend enforces the date comparison.
          x-date-minimum: "1960-01-01"
          x-date-maximum: "2000-01-01"
        college:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        hobbies:
          $ref: "#/components/schemas/HobbyList"
        customHobbies:
          $ref: "#/components/schemas/HobbyList"
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
        isActive:
          type: boolean
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

