components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: HttpOnly session cookie issued by the login endpoint.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required for state-changing requests after login.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: umk_<prefix>_<secret>
      description: Organization-bound API key accepted only in the Authorization header.

  headers:
    RequestId:
      description: Correlation identifier for the request.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    RateLimitLimit:
      description: Maximum requests permitted in the current rate-limit window.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the current rate-limit window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Unix timestamp in seconds when the current rate-limit window resets.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: Number of seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1

  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: Organization UUID used to establish tenant context.
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Session UUID; raw session values are never exposed.
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OidcProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[a-z0-9][a-z0-9_-]*$"
    UserStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/UserStatus"
    RoleFilter:
      name: role
      in: query
      schema:
        type: string
        maxLength: 64
    UserId:
      name: userId
      in: path
      required: true
      description: User UUID.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Case-insensitive name or email search.
      schema:
        type: string
        maxLength: 120
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [name, email, birthDate, createdAt, updatedAt]
        default: createdAt
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc

  responses:
    BadRequest:
      description: The request is syntactically invalid or violates a business rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is required or the credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated user is not allowed to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist or is not active.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with existing data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: The request exceeds the configured size or row limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    DependencyFailure:
      description: A required dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    UserRole:
      type: string
      enum: [admin, user]
    Gender:
      type: string
      enum: [Men, Women]
    User:
      type: object
      required:
        [
          id,
          name,
          email,
          gender,
          birthDate,
          college,
          address,
          hobbies,
          customHobbies,
          role,
          status,
          isActive,
          createdAt,
          updatedAt,
